<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Link to Image</title>

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Link to Image">
    <meta name="theme-color" content="#111316">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="app-shell">
      <section class="tool-panel" aria-label="Link preview generator">
        <div class="header-row">
          <div>
            <h1>Link to Image</h1>
          </div>
          <button class="ghost-button" id="resetButton" type="button">RESET</button>
        </div>

        <div class="tabs" role="tablist">
          <button class="tab active" id="tabAuto" role="tab" aria-selected="true" type="button">Auto-generate</button>
          <button class="tab" id="tabManual" role="tab" aria-selected="false" type="button">Manual</button>
        </div>

        <section class="mode-panel" id="autoPanel" role="tabpanel" aria-labelledby="tabAuto">
          <form class="url-form" id="urlForm">
            <label for="urlInput">Webpage Link</label>
            <div class="input-row">
              <input id="urlInput" name="url" type="url" placeholder="https://example.com/article" autocomplete="url" required>
              <button type="submit">GENERATE</button>
            </div>
          </form>
        </section>

        <section class="mode-panel" id="manualPanel" role="tabpanel" aria-labelledby="tabManual" hidden>
          <form class="url-form" id="manualForm">
            <label for="manualImageUpload">Image</label>
            <input id="manualImageUpload" type="file" accept="image/*">
            <label for="manualSource">Source / Site name</label>
            <input id="manualSource" type="text" placeholder="irishtimes.com">
            <label for="manualTitle">Title</label>
            <textarea id="manualTitle" rows="3" placeholder="Enter the article title here..."></textarea>
            <button type="submit">GENERATE</button>
          </form>
        </section>

        <div class="settings-grid">
          <label>
            Title Size
            <input id="titleSize" type="number" min="40" max="92" step="1" value="58">
          </label>
          <label>
            Image Align
            <select id="imageAlign">
              <option value="center">Centre</option>
              <option value="left">Left</option>
              <option value="right">Right</option>
            </select>
          </label>
          <label>
            Text Background
            <input id="backgroundColor" type="color" value="#000000">
          </label>
          <label>
            Text Colour
            <input id="textColor" type="color" value="#f4f5fb">
          </label>
          <label>
            Trim/Source colour
            <input id="trimColor" type="color" value="#f0d13a">
          </label>
          <label class="span-full">
            Logo Image
            <input id="logoUpload" type="file" accept="image/png,image/svg+xml">
          </label>
          <label class="span-full">
            Text Background Image
            <input id="bgImageUpload" type="file" accept="image/*">
          </label>
        </div>

        <div class="status" id="status" role="status" aria-live="polite">Ready.</div>

        <div class="action-row">
          <button id="downloadButton" type="button">⬇ SAVE IMAGE</button>
          <button id="shareButton" type="button" class="ghost-button">↗ SHARE</button>
        </div>
      </section>

      <section class="preview-panel" aria-label="Generated preview">
        <canvas id="previewCanvas" width="900" height="950"></canvas>
      </section>
    </main>

    <!-- Share modal -->
    <div class="share-overlay" id="shareOverlay" hidden aria-modal="true" role="dialog" aria-label="Share image">
      <div class="share-modal">
        <div class="share-modal-header">
          <span>Share image</span>
          <button class="share-close" id="shareClose" aria-label="Close">✕</button>
        </div>
        <img class="share-preview-img" id="sharePreviewImg" alt="Card preview" />
        <p class="share-hint">Download the image, then post it on your chosen platform:</p>
        <button class="share-download-btn" id="shareDownloadBtn" type="button">⬇ Download image</button>
        <div class="share-divider"><span>then open</span></div>
        <div class="share-buttons">
          <a class="share-btn share-btn--facebook" id="shareFacebook" href="https://www.facebook.com/" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24" fill="currentColor" width="22" height="22"><path d="M24 12.073C24 5.405 18.627 0 12 0S0 5.405 0 12.073C0 18.1 4.388 23.094 10.125 24v-8.437H7.078v-3.49h3.047V9.41c0-3.025 1.792-4.697 4.533-4.697 1.312 0 2.686.236 2.686.236v2.97h-1.513c-1.491 0-1.956.93-1.956 1.883v2.271h3.328l-.532 3.49h-2.796V24C19.612 23.094 24 18.1 24 12.073z"/></svg>
            Facebook
          </a>
          <a class="share-btn share-btn--twitter" id="shareTwitter" href="https://x.com/" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24" fill="currentColor" width="22" height="22"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.746l7.737-8.835L1.254 2.25H8.08l4.253 5.622 5.911-5.622zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
            X (Twitter)
          </a>
          <a class="share-btn share-btn--instagram" id="shareInstagram" href="https://www.instagram.com/" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24" fill="currentColor" width="22" height="22"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"/></svg>
            Instagram
          </a>
        </div>
      </div>
    </div>

    <script src="/app.js" type="module"></script>
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("/sw.js").catch(() => {});
      }
    </script>
  </body>
</html>
