<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Link to Image</title>

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Link to Image">
    <meta name="theme-color" content="#111316">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="app-shell">
      <section class="tool-panel" aria-label="Link preview generator">
        <div class="header-row">
          <div>
            <h1>Link to Image</h1>
          </div>
          <button class="ghost-button" id="resetButton" type="button">RESET</button>
        </div>

        <div class="tabs" role="tablist">
          <button class="tab active" id="tabAuto" role="tab" aria-selected="true" type="button">Auto-generate</button>
          <button class="tab" id="tabManual" role="tab" aria-selected="false" type="button">Manual</button>
        </div>

        <!-- Auto panel -->
        <section class="mode-panel" id="autoPanel" role="tabpanel" aria-labelledby="tabAuto">
          <form class="url-form" id="urlForm">
            <label for="urlInput">Webpage Link</label>
            <div class="input-row">
              <input id="urlInput" name="url" type="url" placeholder="https://example.com/article" autocomplete="url" required>
              <button type="submit">GENERATE</button>
            </div>
          </form>
          <!-- Editable fields shown after auto-fetch -->
          <div id="autoEditFields" hidden>
            <label for="autoSource">Source</label>
            <input id="autoSource" type="text" placeholder="sitename.com">
            <label for="autoTitle">Title</label>
            <textarea id="autoTitle" rows="3" placeholder="Article title..."></textarea>
          </div>
        </section>

        <!-- Manual panel -->
        <section class="mode-panel" id="manualPanel" role="tabpanel" aria-labelledby="tabManual" hidden>
          <form class="url-form" id="manualForm">
            <label for="manualImageUpload">Image</label>
            <input id="manualImageUpload" type="file" accept="image/*">
            <label for="manualSource">Source / Site name</label>
            <input id="manualSource" type="text" placeholder="irishtimes.com">
            <label for="manualTitle">Title</label>
            <textarea id="manualTitle" rows="3" placeholder="Enter the article title here..."></textarea>
            <button type="submit">GENERATE</button>
          </form>
        </section>

        <div class="settings-grid">
          <!-- Text Background — spans full row -->
          <label class="span-full">
            Text Background
            <div class="swatch-picker" data-target="backgroundColor">
              <button type="button" class="swatch selected" data-color="#000000" style="background:#000000" title="Black"></button>
              <button type="button" class="swatch" data-color="#ffffff" style="background:#ffffff" title="White"></button>
              <button type="button" class="swatch" data-color="#FFCC00" style="background:#FFCC00" title="Saffron"></button>
              <button type="button" class="swatch" data-color="#CC0000" style="background:#CC0000" title="Red"></button>
              <button type="button" class="swatch" data-color="#214DCF" style="background:#214DCF" title="Royal Blue"></button>
              <button type="button" class="swatch" data-color="#008A2E" style="background:#008A2E" title="Green"></button>
              <button type="button" class="swatch" data-color="#690000" style="background:#690000" title="Maroon"></button>
              <button type="button" class="swatch" data-color="#360088" style="background:#360088" title="Purple"></button>
              <button type="button" class="swatch" data-color="#FF8400" style="background:#FF8400" title="Orange"></button>
              <button type="button" class="swatch" data-color="#000F60" style="background:#000F60" title="Navy"></button>
              <button type="button" class="swatch" data-color="#49C3FC" style="background:#49C3FC" title="Sky Blue"></button>
            </div>
            <input type="hidden" id="backgroundColor" value="#000000">
          </label>

          <!-- Text Colour -->
          <label class="span-full">
            Text Colour
            <div class="swatch-picker" data-target="textColor">
              <button type="button" class="swatch" data-color="#000000" style="background:#000000" title="Black"></button>
              <button type="button" class="swatch selected" data-color="#ffffff" style="background:#ffffff" title="White"></button>
              <button type="button" class="swatch" data-color="#FFCC00" style="background:#FFCC00" title="Saffron"></button>
              <button type="button" class="swatch" data-color="#CC0000" style="background:#CC0000" title="Red"></button>
              <button type="button" class="swatch" data-color="#214DCF" style="background:#214DCF" title="Royal Blue"></button>
              <button type="button" class="swatch" data-color="#008A2E" style="background:#008A2E" title="Green"></button>
              <button type="button" class="swatch" data-color="#690000" style="background:#690000" title="Maroon"></button>
              <button type="button" class="swatch" data-color="#360088" style="background:#360088" title="Purple"></button>
              <button type="button" class="swatch" data-color="#FF8400" style="background:#FF8400" title="Orange"></button>
              <button type="button" class="swatch" data-color="#000F60" style="background:#000F60" title="Navy"></button>
              <button type="button" class="swatch" data-color="#49C3FC" style="background:#49C3FC" title="Sky Blue"></button>
            </div>
            <input type="hidden" id="textColor" value="#ffffff">
          </label>

          <!-- Trim/Source Colour -->
          <label class="span-full">
            Trim/Source Colour
            <div class="swatch-picker" data-target="trimColor">
              <button type="button" class="swatch" data-color="#000000" style="background:#000000" title="Black"></button>
              <button type="button" class="swatch" data-color="#ffffff" style="background:#ffffff" title="White"></button>
              <button type="button" class="swatch selected" data-color="#FFCC00" style="background:#FFCC00" title="Saffron"></button>
              <button type="button" class="swatch" data-color="#CC0000" style="background:#CC0000" title="Red"></button>
              <button type="button" class="swatch" data-color="#214DCF" style="background:#214DCF" title="Royal Blue"></button>
              <button type="button" class="swatch" data-color="#008A2E" style="background:#008A2E" title="Green"></button>
              <button type="button" class="swatch" data-color="#690000" style="background:#690000" title="Maroon"></button>
              <button type="button" class="swatch" data-color="#360088" style="background:#360088" title="Purple"></button>
              <button type="button" class="swatch" data-color="#FF8400" style="background:#FF8400" title="Orange"></button>
              <button type="button" class="swatch" data-color="#000F60" style="background:#000F60" title="Navy"></button>
              <button type="button" class="swatch" data-color="#49C3FC" style="background:#49C3FC" title="Sky Blue"></button>
            </div>
            <input type="hidden" id="trimColor" value="#FFCC00">
          </label>

          <label class="span-full">
            Logo Image
            <input id="logoUpload" type="file" accept="image/png,image/svg+xml">
          </label>
          <label class="span-full">
            Text Background Image
            <input id="bgImageUpload" type="file" accept="image/*">
          </label>

          <!-- Title Size + Image Align last -->
          <label>
            Title Size
            <div class="stepper">
              <button type="button" class="stepper-btn" id="titleSizeMinus" aria-label="Decrease title size">−</button>
              <input id="titleSize" type="number" min="40" max="92" step="1" value="58">
              <button type="button" class="stepper-btn" id="titleSizePlus" aria-label="Increase title size">+</button>
            </div>
          </label>
          <label>
            Image Align
            <select id="imageAlign">
              <option value="center">Centre</option>
              <option value="left">Left</option>
              <option value="right">Right</option>
            </select>
          </label>
          <label class="span-full">
            Title Font
            <select id="titleFont">
              <option value="Poppins, Arial, sans-serif">Poppins</option>
              <option value="Anton, Arial, sans-serif">Anton</option>
            </select>
          </label>
          <label class="span-full checkbox-label">
            <input type="checkbox" id="titleUppercase">
            Uppercase title
          </label>
        </div>

        <div class="status" id="status" role="status" aria-live="polite">Ready.</div>

        <div class="action-row">
          <button id="downloadButton" type="button">⬇ DOWNLOAD IMAGE</button>
        </div>
      </section>

      <section class="preview-panel" aria-label="Generated preview">
        <canvas id="previewCanvas" width="900" height="950"></canvas>
      </section>
    </main>

    <script src="/app.js" type="module"></script>
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("/sw.js").catch(() => {});
      }
    </script>
  </body>
</html>
