<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Link Preview Card Agent</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="app-shell">
      <section class="tool-panel" aria-label="Link preview generator">
        <div class="header-row">
          <div>
            <h1>Paste URL, Export image</h1>
          </div>
          <button class="ghost-button" id="resetButton" type="button">RESET</button>
        </div>

        <form class="url-form" id="urlForm">
          <label for="urlInput">Webpage URL</label>
          <div class="input-row">
            <input id="urlInput" name="url" type="url" placeholder="https://example.com/article" autocomplete="url" required>
            <button type="submit">Generate</button>
          </div>
        </form>

        <div class="settings-grid">
          <label>
            Image width
            <input id="cardWidth" type="number" min="640" max="1600" step="10" value="900">
          </label>
          <label>
            Title size
            <input id="titleSize" type="number" min="40" max="92" step="1" value="58">
          </label>
          <label>
            Background
            <input id="backgroundColor" type="color" value="#000000">
          </label>
          <label>
            Text Colour
            <input id="textColor" type="color" value="#f4f5fb">
          </label>
          <label>
            Trim colour
            <input id="trimColor" type="color" value="#f0d13a">
          </label>
          <label>
            Logo Image
            <input id="logoUpload" type="file" accept="image/png,image/svg+xml">
          </label>
          <label>
            BG Image
            <input id="bgImageUpload" type="file" accept="image/*">
          </label>
        </div>

        <div class="status" id="status" role="status" aria-live="polite">Ready.</div>

        <div class="action-row">
          <button id="downloadButton" type="button">DOWNLOAD IMAGE</button>
        </div>
      </section>

      <section class="preview-panel" aria-label="Generated preview">
        <canvas id="previewCanvas" width="900" height="950"></canvas>
      </section>
    </main>

    <script src="/app.js" type="module"></script>
  </body>
</html>
