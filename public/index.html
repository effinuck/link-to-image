<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Link to Image</title>

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Link to Image">
    <meta name="theme-color" content="#111316">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Saira+Condensed:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="app-shell">
      <section class="tool-panel" aria-label="Link preview generator">
        <div class="header-row">
          <div>
            <h1>Link to Image</h1>
          </div>
          <button class="ghost-button" id="resetButton" type="button">RESET</button>
        </div>

        <div class="tabs" role="tablist">
          <button class="tab active" id="tabAuto" role="tab" aria-selected="true" type="button">Auto-generate</button>
          <button class="tab" id="tabManual" role="tab" aria-selected="false" type="button">Manual</button>
        </div>

        <!-- Auto panel -->
        <section class="mode-panel" id="autoPanel" role="tabpanel" aria-labelledby="tabAuto">
          <form class="url-form" id="urlForm">
            <label for="urlInput">Webpage Link</label>
            <div class="input-row">
              <input id="urlInput" name="url" type="url" placeholder="https://example.com/article" autocomplete="url" required>
              <button type="submit">GENERATE</button>
            </div>
          </form>
          <!-- Editable fields shown after auto-fetch -->
          <div id="autoEditFields" hidden>
            <label for="autoSource">Source</label>
            <input id="autoSource" type="text" placeholder="sitename.com">
            <label for="autoTitle">Title</label>
            <textarea id="autoTitle" rows="3" placeholder="Article title..."></textarea>
          </div>
        </section>

        <!-- Manual panel -->
        <section class="mode-panel" id="manualPanel" role="tabpanel" aria-labelledby="tabManual" hidden>
          <form class="url-form" id="manualForm">
            <label for="manualImageUpload">Image</label>
            <input id="manualImageUpload" type="file" accept="image/*">
            <label for="manualSource">Source / Site name</label>
            <input id="manualSource" type="text" placeholder="irishtimes.com">
            <label for="manualTitle">Title</label>
            <textarea id="manualTitle" rows="3" placeholder="Enter the article title here..."></textarea>
            <button type="submit">GENERATE</button>
          </form>
        </section>

        <div class="settings-grid">

          <!-- Text Background + Text Colour — two columns -->
          <label>
            Text Background
            <div class="colour-select" id="bgColourSelect" data-target="backgroundColor" data-value="#000000">
              <button type="button" class="colour-select__btn" aria-haspopup="listbox">
                <span class="colour-select__dot" style="background:#000000"></span>
                <span class="colour-select__name">Black</span>
                <span class="colour-select__arrow">▾</span>
              </button>
              <ul class="colour-select__list" role="listbox" hidden>
                <li role="option" data-color="#000000"><span class="colour-select__dot" style="background:#000000"></span>Black</li>
                <li role="option" data-color="#ffffff"><span class="colour-select__dot" style="background:#ffffff"></span>White</li>
                <li role="option" data-color="#FFCC00"><span class="colour-select__dot" style="background:#FFCC00"></span>Saffron</li>
                <li role="option" data-color="#CC0000"><span class="colour-select__dot" style="background:#CC0000"></span>Red</li>
                <li role="option" data-color="#214DCF"><span class="colour-select__dot" style="background:#214DCF"></span>Royal Blue</li>
                <li role="option" data-color="#008A2E"><span class="colour-select__dot" style="background:#008A2E"></span>Green</li>
                <li role="option" data-color="#690000"><span class="colour-select__dot" style="background:#690000"></span>Maroon</li>
                <li role="option" data-color="#360088"><span class="colour-select__dot" style="background:#360088"></span>Purple</li>
                <li role="option" data-color="#FF8400"><span class="colour-select__dot" style="background:#FF8400"></span>Orange</li>
                <li role="option" data-color="#000F60"><span class="colour-select__dot" style="background:#000F60"></span>Navy</li>
                <li role="option" data-color="#49C3FC"><span class="colour-select__dot" style="background:#49C3FC"></span>Sky Blue</li>
              </ul>
            </div>
            <input type="hidden" id="backgroundColor" value="#000000">
          </label>

          <label>
            Text Colour
            <div class="colour-select" id="textColourSelect" data-target="textColor" data-value="#ffffff">
              <button type="button" class="colour-select__btn" aria-haspopup="listbox">
                <span class="colour-select__dot" style="background:#ffffff"></span>
                <span class="colour-select__name">White</span>
                <span class="colour-select__arrow">▾</span>
              </button>
              <ul class="colour-select__list" role="listbox" hidden>
                <li role="option" data-color="#000000"><span class="colour-select__dot" style="background:#000000"></span>Black</li>
                <li role="option" data-color="#ffffff"><span class="colour-select__dot" style="background:#ffffff"></span>White</li>
                <li role="option" data-color="#FFCC00"><span class="colour-select__dot" style="background:#FFCC00"></span>Saffron</li>
                <li role="option" data-color="#CC0000"><span class="colour-select__dot" style="background:#CC0000"></span>Red</li>
                <li role="option" data-color="#214DCF"><span class="colour-select__dot" style="background:#214DCF"></span>Royal Blue</li>
                <li role="option" data-color="#008A2E"><span class="colour-select__dot" style="background:#008A2E"></span>Green</li>
                <li role="option" data-color="#690000"><span class="colour-select__dot" style="background:#690000"></span>Maroon</li>
                <li role="option" data-color="#360088"><span class="colour-select__dot" style="background:#360088"></span>Purple</li>
                <li role="option" data-color="#FF8400"><span class="colour-select__dot" style="background:#FF8400"></span>Orange</li>
                <li role="option" data-color="#000F60"><span class="colour-select__dot" style="background:#000F60"></span>Navy</li>
                <li role="option" data-color="#49C3FC"><span class="colour-select__dot" style="background:#49C3FC"></span>Sky Blue</li>
              </ul>
            </div>
            <input type="hidden" id="textColor" value="#ffffff">
          </label>

          <!-- Trim/Source Colour + Title options — two columns -->
          <label>
            Trim/Source Colour
            <div class="colour-select" id="trimColourSelect" data-target="trimColor" data-value="#FFCC00">
              <button type="button" class="colour-select__btn" aria-haspopup="listbox">
                <span class="colour-select__dot" style="background:#FFCC00"></span>
                <span class="colour-select__name">Saffron</span>
                <span class="colour-select__arrow">▾</span>
              </button>
              <ul class="colour-select__list" role="listbox" hidden>
                <li role="option" data-color="#000000"><span class="colour-select__dot" style="background:#000000"></span>Black</li>
                <li role="option" data-color="#ffffff"><span class="colour-select__dot" style="background:#ffffff"></span>White</li>
                <li role="option" data-color="#FFCC00"><span class="colour-select__dot" style="background:#FFCC00"></span>Saffron</li>
                <li role="option" data-color="#CC0000"><span class="colour-select__dot" style="background:#CC0000"></span>Red</li>
                <li role="option" data-color="#214DCF"><span class="colour-select__dot" style="background:#214DCF"></span>Royal Blue</li>
                <li role="option" data-color="#008A2E"><span class="colour-select__dot" style="background:#008A2E"></span>Green</li>
                <li role="option" data-color="#690000"><span class="colour-select__dot" style="background:#690000"></span>Maroon</li>
                <li role="option" data-color="#360088"><span class="colour-select__dot" style="background:#360088"></span>Purple</li>
                <li role="option" data-color="#FF8400"><span class="colour-select__dot" style="background:#FF8400"></span>Orange</li>
                <li role="option" data-color="#000F60"><span class="colour-select__dot" style="background:#000F60"></span>Navy</li>
                <li role="option" data-color="#49C3FC"><span class="colour-select__dot" style="background:#49C3FC"></span>Sky Blue</li>
              </ul>
            </div>
            <input type="hidden" id="trimColor" value="#FFCC00">
          </label>

          <div class="title-options">
            <label>
              Title Weight
              <select id="titleWeight">
                <option value="800">Extra Bold</option>
              </select>
            </label>
          </div>

          <label class="span-full">
            Logo Image
            <input id="logoUpload" type="file" accept="image/png,image/svg+xml">
          </label>
          <label class="span-full">
            Text Background Image
            <input id="bgImageUpload" type="file" accept="image/*">
          </label>

          <!-- Title Size + Image Align -->
          <label>
            Title Size
            <div class="stepper">
              <button type="button" class="stepper-btn" id="titleSizeMinus" aria-label="Decrease title size">−</button>
              <input id="titleSize" type="number" min="20" max="200" step="1" value="58">
              <button type="button" class="stepper-btn" id="titleSizePlus" aria-label="Increase title size">+</button>
            </div>
          </label>
          <label>
            Image Align
            <select id="imageAlign">
              <option value="center">Centre</option>
              <option value="left">Left</option>
              <option value="right">Right</option>
            </select>
          </label>
          <label class="span-full">
            Text Align
            <select id="textAlign">
              <option value="left">Left (default)</option>
              <option value="center">Centre</option>
            </select>
          </label>

          <!-- Uppercase checkbox -->
          <label class="checkbox-label span-full">
            <input type="checkbox" id="titleUppercase">
            Uppercase
          </label>

        </div>

        <div class="status" id="status" role="status" aria-live="polite">Ready.</div>

        <div class="action-row">
          <button id="downloadButton" type="button">⬇ DOWNLOAD IMAGE</button>
        </div>
      </section>

      <section class="preview-panel" aria-label="Generated preview">
        <canvas id="previewCanvas" width="900" height="950"></canvas>
      </section>
    </main>

    <script src="/app.js" type="module"></script>
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("/sw.js").catch(() => {});
      }
    </script>
  </body>
</html>
