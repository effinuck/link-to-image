<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Link to Image</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Link to Image">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Saira+Condensed:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="app-shell">
      <section class="tool-panel" aria-label="Link preview generator">
        <div class="header-row">
          <div>
            <h1>Link to Image</h1>
          </div>
          <button class="ghost-button" id="resetButton" type="button">RESET</button>
        </div>

        <div class="tabs" role="tablist">
          <button class="tab active" id="tabAuto" role="tab" aria-selected="true" type="button">Auto</button>
          <button class="tab" id="tabManual" role="tab" aria-selected="false" type="button">Manual</button>
          <button class="tab" id="tabTelegram" role="tab" aria-selected="false" type="button">Telegram</button>
        </div>

        <!-- Auto tab -->
        <section class="mode-panel" id="autoPanel" role="tabpanel" aria-labelledby="tabAuto">
          <form class="url-form" id="urlForm">
            <label for="urlInput">Webpage Link</label>
            <div class="input-row">
              <input id="urlInput" name="url" type="url" placeholder="https://example.com/article" autocomplete="url" required>
              <button type="submit">GENERATE</button>
            </div>
          </form>
          <div id="autoFields" hidden>
            <label for="autoSource" class="field-label">Source</label>
            <input id="autoSource" type="text" placeholder="sitename.com">
            <label for="autoTitle" class="field-label">Title</label>
            <textarea id="autoTitle" rows="3"></textarea>
          </div>
        </section>

        <!-- Manual tab -->
        <section class="mode-panel" id="manualPanel" role="tabpanel" aria-labelledby="tabManual" hidden>
          <form class="url-form" id="manualForm">
            <label for="manualImageUpload">Image</label>
            <input id="manualImageUpload" type="file" accept="image/*">
            <label for="manualSource">Source / Site name</label>
            <input id="manualSource" type="text" placeholder="irishtimes.com">
            <label for="manualTitle">Title</label>
            <textarea id="manualTitle" rows="3" placeholder="Enter the article title here..."></textarea>
            <button type="submit">GENERATE</button>
          </form>
        </section>

        <!-- Telegram tab -->
        <section class="mode-panel" id="telegramPanel" role="tabpanel" aria-labelledby="tabTelegram" hidden>
          <div class="telegram-select-row">
            <select id="telegramSelect">
              <option value="">— Select a post —</option>
            </select>
            <button type="button" class="ghost-button refresh-btn" id="telegramRefresh" title="Refresh posts">↻</button>
          </div>
          <div id="telegramFields" hidden>
            <label for="telegramTitle" class="field-label">Title</label>
            <input id="telegramTitle" type="text" placeholder="Article title">
            <label for="telegramSource" class="field-label">Source</label>
            <input id="telegramSource" type="text" placeholder="sitename.com">
            <button type="button" id="telegramGenerate">GENERATE</button>
          </div>
        </section>

        <div class="settings-grid">

          <!-- Text Background (span full) -->
          <div class="colour-select-wrap span-full">
            <label class="colour-select-label">Text Background</label>
            <div class="colour-select" id="backgroundSelect" tabindex="0" role="combobox" aria-expanded="false" aria-label="Text Background colour">
              <span class="colour-dot" id="backgroundDot"></span>
              <span class="colour-name" id="backgroundName"></span>
              <span class="colour-chevron">▾</span>
            </div>
            <div class="colour-dropdown" id="backgroundDropdown" hidden></div>
          </div>

          <!-- Text Colour | Trim/Source Colour -->
          <div class="colour-select-wrap">
            <label class="colour-select-label">Text Colour</label>
            <div class="colour-select" id="textSelect" tabindex="0" role="combobox" aria-expanded="false" aria-label="Text colour">
              <span class="colour-dot" id="textDot"></span>
              <span class="colour-name" id="textName"></span>
              <span class="colour-chevron">▾</span>
            </div>
            <div class="colour-dropdown" id="textDropdown" hidden></div>
          </div>
          <div class="colour-select-wrap">
            <label class="colour-select-label">Trim / Source Colour</label>
            <div class="colour-select" id="trimSelect" tabindex="0" role="combobox" aria-expanded="false" aria-label="Trim and source colour">
              <span class="colour-dot" id="trimDot"></span>
              <span class="colour-name" id="trimName"></span>
              <span class="colour-chevron">▾</span>
            </div>
            <div class="colour-dropdown" id="trimDropdown" hidden></div>
          </div>

          <!-- Text Align | Logo Display -->
          <div class="title-options">
            <label>
              Text Align
              <select id="textAlign">
                <option value="left">Left</option>
                <option value="center">Centre</option>
              </select>
            </label>
            <label>
              Logo Display
              <select id="logoDisplay">
                <option value="off">LOGO OFF</option>
                <option value="on">LOGO ON</option>
              </select>
            </label>
          </div>

          <label class="span-full">
            Text Background Image
            <input id="bgImageUpload" type="file" accept="image/*">
          </label>

          <!-- Layout | Image Fit -->
          <label>
            Layout
            <select id="layoutOrder">
              <option value="image-top">Image top</option>
              <option value="text-top">Text top</option>
            </select>
          </label>
          <label>
            Image Fit
            <select id="imageFit">
              <option value="crop">Cropped</option>
              <option value="full">Full image</option>
            </select>
          </label>

          <!-- Title Size + Case -->
          <label>
            Title Size
            <div class="stepper">
              <button type="button" class="stepper-btn" id="titleSizeMinus" aria-label="Decrease title size">−</button>
              <input id="titleSize" type="number" min="20" max="200" step="1" value="58">
              <button type="button" class="stepper-btn" id="titleSizePlus" aria-label="Increase title size">+</button>
            </div>
          </label>
          <label>
            Title Case
            <select id="titleCase">
              <option value="upper">UPPERCASE</option>
              <option value="lower">Lower case</option>
            </select>
          </label>

        </div>

        <div class="status" id="status" role="status" aria-live="polite">Ready.</div>

        <div class="action-row">
          <button id="downloadButton" type="button">⬇ DOWNLOAD IMAGE</button>
        </div>
      </section>

      <section class="preview-panel" aria-label="Generated preview">
        <canvas id="previewCanvas" width="900" height="1125"></canvas>
      </section>
    </main>

    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      }
    </script>
    <script src="/app.js" type="module"></script>
  </body>
</html>
