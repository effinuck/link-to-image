<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Link to Image</title>

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Link to Image">
    <meta name="theme-color" content="#111316">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="app-shell">
      <section class="tool-panel" aria-label="Link preview generator">
        <div class="header-row">
          <div>
            <h1>Link to Image</h1>
          </div>
          <button class="ghost-button" id="resetButton" type="button">RESET</button>
        </div>

        <div class="tabs" role="tablist">
          <button class="tab active" id="tabAuto" role="tab" aria-selected="true" type="button">Auto-generate</button>
          <button class="tab" id="tabManual" role="tab" aria-selected="false" type="button">Manual</button>
        </div>

        <section class="mode-panel" id="autoPanel" role="tabpanel" aria-labelledby="tabAuto">
          <form class="url-form" id="urlForm">
            <label for="urlInput">Webpage Link</label>
            <div class="input-row">
              <input id="urlInput" name="url" type="url" placeholder="https://example.com/article" autocomplete="url" required>
              <button type="submit">GENERATE</button>
            </div>
          </form>
        </section>

        <section class="mode-panel" id="manualPanel" role="tabpanel" aria-labelledby="tabManual" hidden>
          <form class="url-form" id="manualForm">
            <label for="manualImageUpload">Image</label>
            <input id="manualImageUpload" type="file" accept="image/*">
            <label for="manualSource">Source / Site name</label>
            <input id="manualSource" type="text" placeholder="irishtimes.com">
            <label for="manualTitle">Title</label>
            <textarea id="manualTitle" rows="3" placeholder="Enter the article title here..."></textarea>
            <button type="submit">GENERATE</button>
          </form>
        </section>

        <div class="settings-grid">
          <label>
            Text Background
            <input id="backgroundColor" type="color" value="#000000">
          </label>
          <label>
            Text Colour
            <input id="textColor" type="color" value="#f4f5fb">
          </label>
          <label>
            Trim/Source colour
            <input id="trimColor" type="color" value="#f0d13a">
          </label>
          <label class="span-full">
            Logo Image
            <input id="logoUpload" type="file" accept="image/png,image/svg+xml">
          </label>
          <label class="span-full">
            Text Background Image
            <input id="bgImageUpload" type="file" accept="image/*">
          </label>
          <label>
            Title Size
            <input id="titleSize" type="number" min="40" max="92" step="1" value="58">
          </label>
          <label>
            Image Align
            <select id="imageAlign">
              <option value="center">Centre</option>
              <option value="left">Left</option>
              <option value="right">Right</option>
            </select>
          </label>
        </div>

        <div class="status" id="status" role="status" aria-live="polite">Ready.</div>

        <div class="action-row">
          <button id="downloadButton" type="button">⬇ DOWNLOAD IMAGE</button>
        </div>
      </section>

      <section class="preview-panel" aria-label="Generated preview">
        <canvas id="previewCanvas" width="900" height="950"></canvas>
      </section>
    </main>

    <script src="/app.js" type="module"></script>
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("/sw.js").catch(() => {});
      }
    </script>
  </body>
</html>
